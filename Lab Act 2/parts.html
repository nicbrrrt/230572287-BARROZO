<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechNic - PC Parts</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">TechNic</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="pcbuild.html">PC</a></li>
        <li><a href="parts.html">Parts</a></li>
        <li><a href="buildapc.html">Build A PC</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
    <div class="search-container">
        <input type="text" placeholder="Search PC Parts...">
      </div>
  </header>

  <section class="categories">
    <div class="category" id="cpu">
      <h2>CPU</h2>
    </div>
    <div class="category" id="gpu">
      <h2>GPU</h2>
    </div>
    <div class="category" id="ram">
      <h2>RAM</h2>
    </div>
    <div class="category" id="motherboard">
      <h2>MOTHERBOARD</h2>
    </div>
    <div class="category" id="cases">
      <h2>CASES</h2>
    </div>
    <div class="category" id="psu">
      <h2>PSU</h2>
    </div>
    <div class="category" id="others">
      <h2>OTHERS</h2>
    </div>
  </section>

  <!-- Parts Showcase (this will be shown when a category is clicked) -->
  <section class="parts">
    <!-- GPU Example -->
    <div class="part-category" id="gpu-parts">
      <h2>Graphics Cards</h2>
      <div class="product-card">
        <img src="graphics-card.jpg" alt="Graphics Card" class="product-image">
        <div class="product-info">
          <h3>RTX 4080</h3>

          <p>PRICE: $1150</p>
          <button class="cta-button">View Details</button>
        </div>
      </div>
    </div>

    <!-- CPU Example -->
    <div class="part-category" id="cpu-parts">
      <h2>Processors</h2>
      <div class="product-card">
        <img src="processor.jpeg" alt="Processor" class="product-image">
        <div class="product-info">
          <h3>Ryzen 5 8600</h3>
          <p>Price: $260 </p>
          <button class="cta-button">View Details</button>
        </div>
      </div>
    </div>


  </section>
</body>
</html>
